# ============================================================
# WORKFLOW "MỞ ZIP" — cài MỘT LẦN DUY NHẤT vào .github/workflows/build.yml
# Sau đó mỗi lần ra bản mới chỉ cần up đúng 1 file *-source.zip lên repo
# (bằng điện thoại cũng được), workflow tự mở zip ra cây thư mục rồi build.
# Áp dụng cho mọi tweak đóng gói dạng zip nguồn của Quoc
# (ChargeGuard, AppInfoPress, TweakPacker, GhostModeHome, WaveToSilence...).
# ============================================================
name: Build from source zip
on:
  push:
    paths:
      - '*-source.zip'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: rootful
            theos: theos/theos
            scheme: ""
          - name: rootless
            theos: theos/theos
            scheme: rootless
          - name: roothide
            theos: roothide/theos
            scheme: roothide
    steps:
      - uses: actions/checkout@v4

      - name: Mở zip nguồn ra cây thư mục
        run: |
          ZIP=$(ls *-source.zip | sort -V | tail -n 1)
          if [ -z "$ZIP" ]; then echo "Không thấy file *-source.zip nào trong repo"; exit 1; fi
          echo "Đang mở: $ZIP"
          rm -rf _src && mkdir _src
          unzip -o "$ZIP" -d _src
          cp -a _src/. .
          rm -rf _src
          ls

      - name: Cài công cụ
        run: |
          brew install ldid dpkg make
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

      - name: Cài Theos (${{ matrix.theos }})
        run: |
          git clone --recursive --depth=1 https://github.com/${{ matrix.theos }}.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Tải SDK (có private framework)
        run: |
          git clone --depth=1 https://github.com/theos/sdks.git /tmp/sdks
          rm -rf $THEOS/sdks && mkdir -p $THEOS/sdks
          cp -R /tmp/sdks/*.sdk $THEOS/sdks/ || true
          ls $THEOS/sdks

      - name: Sửa quyền script cài đặt (nếu dự án có)
        run: chmod 755 layout/DEBIAN/postinst layout/DEBIAN/prerm 2>/dev/null || true

      - name: Build
        run: |
          if [ -n "${{ matrix.scheme }}" ]; then export THEOS_PACKAGE_SCHEME=${{ matrix.scheme }}; fi
          make package FINALPACKAGE=1

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.name }}
          path: packages/*.deb
